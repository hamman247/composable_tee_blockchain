[package]
name = "root-trust-tee"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "root-trust-tee"
path = "src/main.rs"

[dependencies]
tee-types = { path = "../../crates/tee-types" }
tee-crypto = { path = "../../crates/tee-crypto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha3 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
alloy-primitives = { version = "0.8", features = ["rand"] }
